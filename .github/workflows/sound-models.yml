name: sound-models

# Exports the stick lighting's sound models (EfficientAT, CLAP) to ONNX, checks them against the originals and
# compares them with YAMNet on public sounds. Runs when the scripts change, or by hand.
on:
  pull_request:
    paths:
      - 'src/tools/sound-models/**'
      - '.github/workflows/sound-models.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  models:
    # Public repository: GitHub-hosted runner only.
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchaudio==2.5.1 torchvision==0.20.1
          pip install -r src/tools/sound-models/requirements.txt
      - name: Export
        run: python src/tools/sound-models/export.py --out work/models --work work/src
      - name: EfficientAT on its own example (this PyTorch)
        if: always()
        working-directory: work/src/EfficientAT
        run: pip install -q librosa==0.10.2.post1 && python ../../../src/tools/sound-models/eat_check.py
      - name: YAMNet (the model the app uses today)
        run: |
          mkdir -p work/yamnet
          curl -sfL https://huggingface.co/zeropointnine/yamnet-onnx/resolve/main/yamnet.onnx -o work/yamnet/yamnet.onnx
          curl -sfL https://huggingface.co/zeropointnine/yamnet-onnx/resolve/main/yamnet_class_map.csv -o work/yamnet/yamnet_class_map.csv
      # the sounds take long to download (the servers limit requests): each run keeps what it has, and the next one
      # goes on from the newest
      - uses: actions/cache/restore@v4
        with:
          path: work/data
          key: sound-eval-data-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sound-eval-data-v2-
      - name: Evaluate
        run: python src/tools/sound-models/evaluate.py --models work/models --yamnet work/yamnet --data work/data --report work/report.md --scores work/scores.json.gz
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: work/data
          key: sound-eval-data-v2-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report
        if: always()
        run: if [ -f work/report.md ]; then cat work/report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sound-models
          path: |
            work/models/*.onnx
            work/models/*.csv
            work/models/export.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sound-eval
          path: |
            work/report.md
            work/scores.json.gz
            work/test-clips/
          retention-days: 14

  # EfficientAT as its repository pins it (PyTorch 1.13, Python 3.10), on the same example: tells whether a newer
  # PyTorch changes what the model hears
  efficientat-pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: EfficientAT on its own example (PyTorch 1.13)
        run: |
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu torch==1.13.0+cpu torchaudio==0.13.0+cpu torchvision==0.14.0+cpu numpy==1.23.3 librosa==0.9.2
          git clone -q https://github.com/fschmid56/EfficientAT work/EfficientAT
          git -C work/EfficientAT checkout -q a425fdce92572e602a1d5634799bd9f1f2efa806
          cd work/EfficientAT && python ../../src/tools/sound-models/eat_check.py
